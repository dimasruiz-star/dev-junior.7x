<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAXAREES LIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030303;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Pantalla de entrada Click to Enter */
    #enter-screen {
      transition: opacity 0.8s ease-out, visibility 0.8s;
    }

    /* Animación de carga en la línea roja */
    .loader-line-red {
      animation: loadLine 1.8s infinite ease-in-out;
    }

    @keyframes loadLine {
      0% {
        left: -100%;
        width: 30%;
      }
      50% {
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    /* Cursor parpadeante de escritura red */
    .typing-cursor::after {
      content: '|';
      color: #ef4444;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Texto 3D gigante de fondo NAXAREES */
    .bg-text-naxarees {
      font-size: clamp(6rem, 25vw, 28rem);
      font-weight: 900;
      letter-spacing: -2px;
      color: rgba(255, 255, 255, 0.08);
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.15),
        0 4px 10px rgba(0, 0, 0, 0.8),
        -2px 2px 5px rgba(255, 255, 255, 0.05);
      user-select: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Tarjeta principal estilo Glassmorphism */
    .glass-profile-card {
      background: rgba(13, 13, 15, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(120, 50, 255, 0.12);
    }

    /* Anillo neón morado del avatar */
    .avatar-ring-glow {
      box-shadow: 
        0 0 20px #9333ea,
        0 0 40px rgba(147, 51, 234, 0.4);
    }

    /* EFECTOS NEÓN AL PASAR EL MOUSE (HOVER) EN REDES SOCIALES */
    .social-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-btn-yt:hover {
      color: #ff0000;
      border-color: rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-dc:hover {
      color: #5865f2;
      border-color: rgba(88, 101, 242, 0.5);
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-wa:hover {
      color: #25d366;
      border-color: rgba(37, 211, 102, 0.5);
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-tk:hover {
      color: #00f2fe;
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transform: translateY(-2px);
    }

    /* Animación del ecualizador inferior */
    .eq-bar {
      animation: eqBounce 1.2s infinite ease-in-out alternate;
    }
    @keyframes eqBounce {
      0% { height: 3px; }
      100% { height: 26px; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-black overflow-y-auto py-8">

  <!-- Audio de fondo -->
  <audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
  </audio>

  <!-- PANTALLA DE ENTRADA (CLICK TO ENTER) -->
  <div id="enter-screen" onclick="enterSite()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center cursor-pointer select-none">
    <div class="text-xs md:text-sm font-bold tracking-[0.3em] text-white uppercase mb-3 hover:scale-105 transition-transform">
      CLICK TO ENTER
    </div>
    
    <!-- Barra con animación de carga de izquierda a derecha -->
    <div class="w-20 h-[2px] bg-neutral-800 relative overflow-hidden rounded-full">
      <div class="loader-line-red absolute top-0 h-full bg-red-600 shadow-[0_0_8px_#ef4444]"></div>
    </div>
  </div>

  <!-- Fondo Neón & Texto 3D NAXAREES -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px] bg-red-600/15 rounded-full blur-[150px]"></div>
    <div class="absolute -bottom-32 -right-32 w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[150px]"></div>
    
    <h1 class="bg-text-naxarees select-none uppercase font-black tracking-tighter">NAXAREES</h1>
  </div>

  <!-- Contenedor Principal de la tarjeta -->
  <div class="relative z-10 w-full max-w-[420px] px-4">

    <!-- Indicador superior -->
    <div class="flex justify-center mb-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/80 border border-white/10 backdrop-blur-md text-[11px] text-gray-300">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span><strong class="font-bold text-white">2</strong> viendo ahora</span>
      </div>
    </div>

    <!-- Tarjeta de Perfil -->
    <div class="glass-profile-card rounded-[28px] p-6 flex flex-col items-center text-center relative overflow-hidden">
      
      <!-- Avatar con marco Neón Morado -->
      <div class="relative mb-3 mt-1">
        <div class="w-24 h-24 rounded-full p-[3px] bg-gradient-to-tr from-purple-600 via-purple-400 to-indigo-500 avatar-ring-glow">
          <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-full h-full object-cover rounded-full bg-neutral-900" alt="Avatar" />
        </div>
        <span id="discord-status-dot" class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-[#0d0d0f]"></span>
      </div>

      <!-- Título de Usuario -->
      <h2 id="discord-username" class="text-lg font-extrabold tracking-wider text-red-500 uppercase">NAXAREES LIVE</h2>
      
      <!-- Insignia de Estado -->
      <div class="inline-flex items-center gap-1.5 px-3 py-0.5 mt-1 rounded-full bg-black/60 border border-white/10 text-[10px] font-semibold text-gray-300 tracking-wide">
        <span id="status-badge-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="status-text">EN LÍNEA</span>
      </div>

      <!-- Botón Principal -->
      <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-full mt-4 py-2.5 px-4 rounded-xl bg-gradient-to-r from-red-700 via-red-600 to-red-800 hover:from-red-600 hover:to-red-700 font-extrabold text-[11px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-red-900/30 transition-transform active:scale-95">
        <i class="fa-solid fa-cart-shopping text-xs"></i> NAXAREES XITER
      </a>

      <!-- Texto con Animación de Escribir y Borrar Loop -->
      <p class="text-[11px] text-gray-300 my-4 leading-relaxed px-1 font-normal min-h-[36px]">
        <span id="typed-text"></span><span class="typing-cursor"></span>
      </p>

      <!-- Tarjeta de Actividad en vivo -->
      <div class="w-full bg-[#0a0a0c]/80 border border-white/5 rounded-2xl p-3 text-left mb-4 flex items-center gap-3">
        <img id="activity-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-9 h-9 rounded-full object-cover shrink-0 border border-white/10" alt="Icon" />
        <div class="overflow-hidden leading-tight">
          <div id="card-username" class="text-[11px] font-bold text-white tracking-wide uppercase">NAXAREES LIVE</div>
          <div id="card-discord-bio" class="text-[9px] text-gray-400 mt-0.5 uppercase tracking-wider hidden"></div>
          <div id="card-discord-time" class="text-[9px] text-gray-500 mt-0.5 font-mono hidden"></div>
        </div>
      </div>

      <!-- Iconos de Redes Sociales con efecto Neón Hover -->
      <div class="flex items-center justify-center gap-3 w-full mb-4">
        <a href="https://youtube.com" target="_blank" class="social-btn social-btn-yt w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300"><i class="fa-brands fa-youtube text-sm"></i></a>
        <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="social-btn social-btn-dc w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300"><i class="fa-brands fa-discord text-sm"></i></a>
        <a href="https://wa.me/" target="_blank" class="social-btn social-btn-wa w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300"><i class="fa-brands fa-whatsapp text-sm"></i></a>
        <a href="https://tiktok.com" target="_blank" class="social-btn social-btn-tk w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300"><i class="fa-brands fa-tiktok text-sm"></i></a>
      </div>

      <!-- Tarjeta Enlace -->
      <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-full bg-[#0a0a0c]/60 border border-white/5 hover:border-white/15 rounded-xl p-3 flex items-center justify-between transition-colors mb-4 group">
        <div class="flex items-center gap-2.5">
          <i class="fa-brands fa-discord text-lg text-gray-300"></i>
          <div class="text-left">
            <div class="text-[11px] font-bold text-white">Tienda De Hacks</div>
            <div class="text-[9px] text-gray-400">https://discord.gg/YGtZFwfY3U</div>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right text-[10px] text-gray-500 group-hover:text-white transition-colors"></i>
      </a>

      <!-- Pie de página -->
      <div class="flex items-center justify-between w-full text-[10px] text-gray-400 border-t border-white/5 pt-3 font-medium">
        <span class="flex items-center gap-1.5"><i class="fa-regular fa-eye"></i> 65 vistas</span>
        <span class="flex items-center gap-1.5 cursor-pointer hover:text-white"><i class="fa-solid fa-share-nodes"></i> compartir</span>
        <span id="live-clock" class="flex items-center gap-1.5"><i class="fa-regular fa-clock"></i> 20:28:39</span>
      </div>

    </div>

    <!-- Barra inferior ecualizador de audio -->
    <div class="mt-4 flex items-center justify-center gap-4 bg-black/70 backdrop-blur-md border border-white/10 rounded-full py-2 px-6 w-fit mx-auto">
      <div class="flex items-end gap-0.5 h-5">
        <span class="w-0.5 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.1s"></span>
        <span class="w-0.5 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.3s"></span>
        <span class="w-0.5 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.2s"></span>
        <span class="w-0.5 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.5s"></span>
        <span class="w-0.5 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.4s"></span>
      </div>
      <button onclick="toggleAudio()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-white text-[10px]">
        <i id="audio-icon" class="fa-solid fa-pause"></i>
      </button>
    </div>

  </div>

  <script>
    const DISCORD_ID = '1506432227767226398';

    // TEXTO DE LA BIO
    const bioText = "Somos una empresa comprometida en ofrecer el mejor producto al mejor precio, con calidad y atención garantizada.";
    let charIndex = 0;
    let isDeleting = false;

    // Escribir y Borrar en bucle
    function handleTypingLoop() {
      const typedElement = document.getElementById("typed-text");

      if (!isDeleting && charIndex <= bioText.length) {
        typedElement.innerHTML = bioText.substring(0, charIndex);
        charIndex++;
        if (charIndex > bioText.length) {
          isDeleting = true;
          setTimeout(handleTypingLoop, 2500);
          return;
        }
        setTimeout(handleTypingLoop, 40);
      } else if (isDeleting && charIndex >= 0) {
        typedElement.innerHTML = bioText.substring(0, charIndex);
        charIndex--;
        if (charIndex < 0) {
          isDeleting = false;
          charIndex = 0;
          setTimeout(handleTypingLoop, 500);
          return;
        }
        setTimeout(handleTypingLoop, 20);
      }
    }

    function enterSite() {
      const enterScreen = document.getElementById('enter-screen');
      const music = document.getElementById('bg-music');
      
      music.play().catch(() => {});
      enterScreen.style.opacity = '0';
      setTimeout(() => {
        enterScreen.style.display = 'none';
      }, 800);
    }

    function toggleAudio() {
      const music = document.getElementById('bg-music');
      const icon = document.getElementById('audio-icon');
      if (music.paused) {
        music.play();
        icon.className = 'fa-solid fa-pause';
      } else {
        music.pause();
        icon.className = 'fa-solid fa-play';
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerHTML = `<i class="fa-regular fa-clock"></i> ${now.toTimeString().split(' ')[0]}`;
    }

    let activityTimerInterval = null;

    function formatDuration(startTimeMs) {
      const diffSecs = Math.floor((Date.now() - startTimeMs) / 1000);
      const hours = Math.floor(diffSecs / 3600);
      const mins = Math.floor((diffSecs % 3600) / 60);
      const secs = diffSecs % 60;

      const pMins = String(mins).padStart(2, '0');
      const pSecs = String(secs).padStart(2, '0');

      if (hours > 0) {
        const pHours = String(hours).padStart(2, '0');
        return `${pHours}:${pMins}:${pSecs}`;
      }
      return `${pMins}:${pSecs}`;
    }

    function obtenerDatosDiscord() {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            const data = res.data;

            // 1. Avatar
            if (data.discord_user.avatar) {
              const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=256`;
              document.getElementById('discord-avatar').src = avatarUrl;
              document.getElementById('activity-avatar').src = avatarUrl;
            }

            // 2. Nombre de usuario
            const username = (data.discord_user.global_name || data.discord_user.username).toUpperCase();
            document.getElementById('discord-username').innerText = "NAXAREES LIVE";
            document.getElementById('card-username').innerText = username;

            // 3. Actividad & Biografía
            const bioContainer = document.getElementById('card-discord-bio');
            const timeContainer = document.getElementById('card-discord-time');
            
            if (activityTimerInterval) clearInterval(activityTimerInterval);
            timeContainer.classList.add('hidden');

            let gameActivity = null;
            if (data.activities && data.activities.length > 0) {
              gameActivity = data.activities.find(a => a.type === 0) || data.activities[0];
            }

            if (gameActivity && gameActivity.name) {
              bioContainer.innerText = `JUGANDO A ${gameActivity.name.toUpperCase()}`;
              bioContainer.classList.remove('hidden');

              if (gameActivity.timestamps && gameActivity.timestamps.start) {
                const startTime = gameActivity.timestamps.start;
                timeContainer.innerText = formatDuration(startTime);
                timeContainer.classList.remove('hidden');

                activityTimerInterval = setInterval(() => {
                  timeContainer.innerText = formatDuration(startTime);
                }, 1000);
              }
            } 
            else if (data.kv && data.kv.bio) {
              bioContainer.innerText = data.kv.bio;
              bioContainer.classList.remove('hidden');
            } 
            else {
              bioContainer.innerText = "";
              bioContainer.classList.add('hidden');
            }

            // 4. Estado (Online, Idle, DND, Offline)
            const statusDot = document.getElementById('discord-status-dot');
            const statusBadgeDot = document.getElementById('status-badge-dot');
            const statusText = document.getElementById('status-text');

            const statusColors = {
              online: { bg: 'bg-emerald-500', label: 'EN LÍNEA' },
              idle: { bg: 'bg-amber-500', label: 'AUSENTE' },
              dnd: { bg: 'bg-red-500', label: 'NO MOLESTAR' },
              offline: { bg: 'bg-gray-500', label: 'DESCONECTADO' }
            };

            const status = statusColors[data.discord_status] || statusColors.offline;
            statusDot.className = `absolute bottom-1 right-1 w-5 h-5 rounded-full border-2 border-[#0d0d0f] ${status.bg}`;
            statusBadgeDot.className = `w-1.5 h-1.5 rounded-full ${status.bg}`;
            statusText.innerText = status.label;
          }
        })
        .catch(() => {
          document.getElementById('card-discord-bio').classList.add('hidden');
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      obtenerDatosDiscord();
      handleTypingLoop();
      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>

</body>
</html>
