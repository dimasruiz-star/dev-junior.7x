<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAXAREES LIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #030303;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Pantalla de entrada Click to Enter */
    #enter-screen {
      transition: opacity 0.8s ease-out, visibility 0.8s;
    }

    /* Animación de carga en la línea roja */
    .loader-line-red {
      animation: loadLine 1.8s infinite ease-in-out;
    }

    @keyframes loadLine {
      0% { left: -100%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }

    /* Cursor parpadeante de escritura */
    .typing-cursor::after {
      content: '|';
      color: #ef4444;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ANIMACIÓN DE PARTÍCULAS ROJAS DE FONDO */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.7);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) scale(0.3);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* Texto 3D gigante de fondo NAXAREES */
    .bg-text-naxarees {
      font-size: clamp(3rem, 11vw, 12rem);
      font-weight: 900;
      letter-spacing: -2px;
      color: rgba(255, 255, 255, 0.08);
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.15),
        0 4px 10px rgba(0, 0, 0, 0.8),
        -2px 2px 5px rgba(255, 255, 255, 0.05);
      user-select: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Tarjeta principal transparente centrada */
    .glass-profile-card {
      background: rgba(10, 10, 12, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(168, 85, 247, 0.15);
    }

    /* Anillo neón morado del avatar */
    .avatar-ring-glow {
      box-shadow: 
        0 0 25px #a855f7,
        0 0 50px rgba(168, 85, 247, 0.5);
    }

    /* EFECTOS NEÓN EN HOVER PARA REDES SOCIALES */
    .social-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-btn-yt:hover {
      color: #ff0000;
      border-color: rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-dc:hover {
      color: #5865f2;
      border-color: rgba(88, 101, 242, 0.5);
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-wa:hover {
      color: #25d366;
      border-color: rgba(37, 211, 102, 0.5);
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.6);
      transform: translateY(-2px);
    }

    .social-btn-tk:hover {
      color: #00f2fe;
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transform: translateY(-2px);
    }

    /* Ecualizador inferior */
    .eq-bar {
      animation: eqBounce 1.2s infinite ease-in-out alternate;
    }
    .eq-bar-paused {
      animation-play-state: paused !important;
      height: 4px !important;
    }
    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 32px; }
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center relative bg-black overflow-y-auto py-8">

  <!-- REPRODUCTOR DE AUDIO MP3 LOCAL -->
  <audio id="bg-music" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg" />
  </audio>

  <!-- PANTALLA DE ENTRADA (CLICK TO ENTER) -->
  <div id="enter-screen" onclick="enterSite()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center cursor-pointer select-none">
    <div class="text-xs md:text-sm font-bold tracking-[0.3em] text-white uppercase mb-3 hover:scale-105 transition-transform">
      CLICK TO ENTER
    </div>
    <div class="w-20 h-[2px] bg-neutral-800 relative overflow-hidden rounded-full">
      <div class="loader-line-red absolute top-0 h-full bg-red-600 shadow-[0_0_8px_#ef4444]"></div>
    </div>
  </div>

  <!-- CAPA DE PARTÍCULAS ROJAS FLOTANTES -->
  <div id="particle-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- FONDO NEÓN & TEXTO 3D NAXAREES CENTRADO -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0">
    <div class="absolute w-[500px] h-[500px] bg-red-600/15 rounded-full blur-[160px]"></div>
    <div class="absolute w-[400px] h-[400px] bg-purple-600/15 rounded-full blur-[160px]"></div>
    <h1 class="bg-text-naxarees select-none uppercase font-black tracking-tighter">NAXAREES</h1>
  </div>

  <!-- CONTENEDOR PRINCIPAL TOTALMENTE CENTRADO -->
  <div class="relative z-10 w-full max-w-[420px] px-4 flex flex-col items-center mx-auto">

    <!-- Indicador superior -->
    <div class="flex justify-center mb-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/70 border border-white/10 backdrop-blur-md text-[11px] text-gray-300">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span><strong class="font-bold text-white">2</strong> viendo ahora</span>
      </div>
    </div>

    <!-- Tarjeta Transparente -->
    <div class="glass-profile-card w-full rounded-[32px] p-6 flex flex-col items-center text-center relative overflow-hidden">
      
      <!-- Avatar -->
      <div class="relative mb-4 mt-2">
        <div class="w-24 h-24 rounded-full p-[3px] bg-gradient-to-tr from-purple-600 via-purple-400 to-indigo-500 avatar-ring-glow">
          <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-full h-full object-cover rounded-full bg-neutral-900" alt="Avatar" />
        </div>
        <span id="discord-status-dot" class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-[#0d0d0f]"></span>
      </div>

      <!-- Título principal -->
      <h2 id="discord-username" class="text-xl font-extrabold tracking-wider text-red-600 uppercase">NAXAREES LIVE</h2>
      
      <!-- Estado -->
      <div class="inline-flex items-center gap-1.5 px-3 py-0.5 mt-1.5 rounded-full bg-black/50 border border-white/10 text-[10px] font-semibold text-gray-300 tracking-wide">
        <span id="status-badge-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="status-text">EN LÍNEA</span>
      </div>

      <!-- Botón principal -->
      <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-full max-w-[280px] mt-5 py-2.5 px-4 rounded-xl bg-gradient-to-r from-red-700/90 via-red-600/90 to-red-800/90 hover:from-red-600 hover:to-red-700 font-extrabold text-[11px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-red-900/40 border border-red-500/40 transition-transform active:scale-95">
        <i class="fa-solid fa-cart-shopping text-xs"></i> NAXAREES XITER
      </a>

      <!-- Texto Typing Loop -->
      <p class="text-[11px] text-gray-300 my-5 leading-relaxed px-2 font-normal min-h-[36px]">
        <span id="typed-text"></span><span class="typing-cursor"></span>
      </p>

      <!-- Tarjeta de Actividad Lanyard -->
      <div class="w-full bg-black/40 border border-white/10 rounded-2xl p-3 text-left mb-5 flex items-center gap-3 backdrop-blur-sm">
        <img id="activity-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-9 h-9 rounded-full object-cover shrink-0 border border-white/10" alt="Icon" />
        <div class="overflow-hidden leading-tight">
          <div id="card-username" class="text-[11px] font-bold text-white tracking-wide uppercase">NAXAREES LIVE</div>
          <div id="card-discord-bio" class="text-[9px] text-gray-400 mt-0.5 uppercase tracking-wider hidden"></div>
          <div id="card-discord-time" class="text-[9px] text-gray-500 mt-0.5 font-mono hidden"></div>
        </div>
      </div>

      <!-- Redes Sociales -->
      <div class="flex items-center justify-center gap-3 w-full mb-5">
        <a href="https://youtube.com" target="_blank" class="social-btn social-btn-yt w-10 h-10 rounded-xl bg-black/40 border border-white/10 flex items-center justify-center text-gray-300 backdrop-blur-sm"><i class="fa-brands fa-youtube text-base"></i></a>
        <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="social-btn social-btn-dc w-10 h-10 rounded-xl bg-black/40 border border-white/10 flex items-center justify-center text-gray-300 backdrop-blur-sm"><i class="fa-brands fa-discord text-base"></i></a>
        <a href="https://wa.me/" target="_blank" class="social-btn social-btn-wa w-10 h-10 rounded-xl bg-black/40 border border-white/10 flex items-center justify-center text-gray-300 backdrop-blur-sm"><i class="fa-brands fa-whatsapp text-base"></i></a>
        <a href="https://tiktok.com" target="_blank" class="social-btn social-btn-tk w-10 h-10 rounded-xl bg-black/40 border border-white/10 flex items-center justify-center text-gray-300 backdrop-blur-sm"><i class="fa-brands fa-tiktok text-base"></i></a>
      </div>

      <!-- Tarjeta Enlace Tienda Hacks -->
      <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-full bg-black/40 border border-white/10 hover:border-white/20 rounded-2xl p-3 flex items-center justify-between transition-colors mb-3 group backdrop-blur-sm">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300">
            <i class="fa-brands fa-discord text-lg"></i>
          </div>
          <div class="text-left">
            <div class="text-[11px] font-bold text-white">Tienda De Hacks</div>
            <div class="text-[9px] text-gray-400">https://discord.gg/YGtZFwfY3U</div>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right text-[10px] text-gray-500 group-hover:text-white transition-colors"></i>
      </a>

      <!-- Tarjeta Enlace WhatsApp -->
      <a href="https://wa.me/" target="_blank" class="w-full bg-black/40 border border-white/10 hover:border-white/20 rounded-2xl p-3 flex items-center justify-between transition-colors mb-5 group backdrop-blur-sm">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300">
            <i class="fa-brands fa-whatsapp text-lg"></i>
          </div>
          <div class="text-left">
            <div class="text-[11px] font-bold text-white">Comprar Hacks</div>
            <div class="text-[9px] text-gray-400">https://chat.whatsapp.com/...</div>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right text-[10px] text-gray-500 group-hover:text-white transition-colors"></i>
      </a>

      <!-- Sección de Píldoras Centradas -->
      <div class="flex flex-col items-center gap-2 w-full pt-1">
        <div class="inline-flex items-center justify-center gap-1.5 px-4 py-1.5 rounded-full bg-black/40 border border-white/10 text-[11px] text-gray-300 font-medium min-w-[125px]">
          <i class="fa-regular fa-eye text-xs"></i> <span>90 vistas</span>
        </div>
        <button onclick="shareProfile()" class="inline-flex items-center justify-center gap-1.5 px-4 py-1.5 rounded-full bg-black/40 border border-white/10 text-[11px] text-gray-300 font-medium hover:text-white hover:border-white/20 transition-colors min-w-[125px]">
          <i class="fa-solid fa-share-nodes text-xs"></i> <span>compartir</span>
        </button>
        <div id="live-clock" class="flex items-center gap-1.5 text-[11px] text-gray-400 font-medium mt-1">
          <i class="fa-regular fa-clock"></i> <span>15:39:49</span>
        </div>
      </div>

    </div>

    <!-- Ecualizador de Audio Inferior -->
    <div class="mt-6 flex items-end justify-center gap-1 h-8 cursor-pointer" onclick="toggleAudio()" title="Pausar / Reproducir MP3">
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.1s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.3s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.2s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.5s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.4s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.15s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.35s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.25s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.45s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.05s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.3s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.2s"></span>
      <span class="w-1 bg-red-600 rounded-full eq-bar" style="animation-delay: 0.5s"></span>
    </div>

  </div>

  <script>
    const DISCORD_ID = '';
    const music = document.getElementById('bg-music');

    // Generador de partículas rojas flotantes
    function createParticles() {
      const container = document.getElementById('particle-container');
      const particleCount = 35;
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}%`;
        p.style.animationDuration = `${Math.random() * 8 + 4}s`;
        p.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(p);
      }
    }

    // Texto de la bio
    const bioText = "Somos una empresa comprometida en ofrecer el mejor producto al mejor precio, con calidad y atención garantizada.";
    let charIndex = 0;
    let isDeleting = false;

    function handleTypingLoop() {
      const typedElement = document.getElementById("typed-text");

      if (!isDeleting && charIndex <= bioText.length) {
        typedElement.innerHTML = bioText.substring(0, charIndex);
        charIndex++;
        if (charIndex > bioText.length) {
          isDeleting = true;
          setTimeout(handleTypingLoop, 2500);
          return;
        }
        setTimeout(handleTypingLoop, 40);
      } else if (isDeleting && charIndex >= 0) {
        typedElement.innerHTML = bioText.substring(0, charIndex);
        charIndex--;
        if (charIndex < 0) {
          isDeleting = false;
          charIndex = 0;
          setTimeout(handleTypingLoop, 500);
          return;
        }
        setTimeout(handleTypingLoop, 20);
      }
    }

    function enterSite() {
      const enterScreen = document.getElementById('enter-screen');
      music.play().catch(() => {});
      enterScreen.style.opacity = '0';
      setTimeout(() => {
        enterScreen.style.display = 'none';
      }, 800);
    }

    function toggleAudio() {
      const eqBars = document.querySelectorAll('.eq-bar');
      if (music.paused) {
        music.play();
        eqBars.forEach(b => b.classList.remove('eq-bar-paused'));
      } else {
        music.pause();
        eqBars.forEach(b => b.classList.add('eq-bar-paused'));
      }
    }

    function shareProfile() {
      if (navigator.share) {
        navigator.share({ title: 'NAXAREES LIVE', url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("¡Enlace copiado al portapapeles!");
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerHTML = `<i class="fa-regular fa-clock"></i> <span>${now.toTimeString().split(' ')[0]}</span>`;
    }

    let activityTimerInterval = null;

    function formatDuration(startTimeMs) {
      const diffSecs = Math.floor((Date.now() - startTimeMs) / 1000);
      const hours = Math.floor(diffSecs / 3600);
      const mins = Math.floor((diffSecs % 3600) / 60);
      const secs = diffSecs % 60;

      const pMins = String(mins).padStart(2, '0');
      const pSecs = String(secs).padStart(2, '0');

      if (hours > 0) {
        const pHours = String(hours).padStart(2, '0');
        return `${pHours}:${pMins}:${pSecs}`;
      }
      return `${pMins}:${pSecs}`;
    }

    function obtenerDatosDiscord() {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            const data = res.data;

            if (data.discord_user.avatar) {
              const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=256`;
              document.getElementById('discord-avatar').src = avatarUrl;
              document.getElementById('activity-avatar').src = avatarUrl;
            }

            const username = (data.discord_user.global_name || data.discord_user.username).toUpperCase();
            document.getElementById('discord-username').innerText = "NAXAREES LIVE";
            document.getElementById('card-username').innerText = username;

            const bioContainer = document.getElementById('card-discord-bio');
            const timeContainer = document.getElementById('card-discord-time');
            
            if (activityTimerInterval) clearInterval(activityTimerInterval);
            timeContainer.classList.add('hidden');

            let gameActivity = null;
            if (data.activities && data.activities.length > 0) {
              gameActivity = data.activities.find(a => a.type === 0) || data.activities[0];
            }

            if (gameActivity && gameActivity.name) {
              bioContainer.innerText = `JUGANDO A ${gameActivity.name.toUpperCase()}`;
              bioContainer.classList.remove('hidden');

              if (gameActivity.timestamps && gameActivity.timestamps.start) {
                const startTime = gameActivity.timestamps.start;
                timeContainer.innerText = formatDuration(startTime);
                timeContainer.classList.remove('hidden');

                activityTimerInterval = setInterval(() => {
                  timeContainer.innerText = formatDuration(startTime);
                }, 1000);
              }
            } 
            else if (data.kv && data.kv.bio) {
              bioContainer.innerText = data.kv.bio;
              bioContainer.classList.remove('hidden');
            } 
            else {
              bioContainer.innerText = "";
              bioContainer.classList.add('hidden');
            }

            const statusDot = document.getElementById('discord-status-dot');
            const statusBadgeDot = document.getElementById('status-badge-dot');
            const statusText = document.getElementById('status-text');

            const statusColors = {
              online: { bg: 'bg-emerald-500', label: 'EN LÍNEA' },
              idle: { bg: 'bg-amber-500', label: 'AUSENTE' },
              dnd: { bg: 'bg-red-500', label: 'NO MOLESTAR' },
              offline: { bg: 'bg-gray-500', label: 'DESCONECTADO' }
            };

            const status = statusColors[data.discord_status] || statusColors.offline;
            statusDot.className = `absolute bottom-1 right-1 w-5 h-5 rounded-full border-2 border-[#0d0d0f] ${status.bg}`;
            statusBadgeDot.className = `w-1.5 h-1.5 rounded-full ${status.bg}`;
            statusText.innerText = status.label;
          }
        })
        .catch(() => {
          document.getElementById('card-discord-bio').classList.add('hidden');
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      createParticles();
      obtenerDatosDiscord();
      handleTypingLoop();
      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>

</body>
</html>
