<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TORRES LIVE - Discord Connected</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050507;
      color: #fff;
      overflow-x: hidden;
    }
    .bg-text {
      font-size: clamp(5rem, 18vw, 22rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.03);
      text-stroke: 1px rgba(255, 255, 255, 0.1);
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.08);
      user-select: none;
    }
    .glass-card {
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.86), 
                  0 0 40px -10px rgba(147, 51, 234, 0.15);
    }
    .avatar-glow {
      box-shadow: 0 0 25px #a855f7, 0 0 50px rgba(168, 85, 247, 0.4);
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
      color: #ef4444;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .bar-anim {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }
    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 28px; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-black overflow-y-auto py-10">

  <!-- Fondo Neon & Texto 3D -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-red-600/20 rounded-full blur-[140px]"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-[140px]"></div>
    <h1 class="bg-text select-none uppercase font-extrabold tracking-tighter">TORRES</h1>
  </div>

  <!-- Contenedor Principal -->
  <div class="relative z-10 w-full max-w-md px-4">
    
    <!-- Modal de Configuración de ID de Discord -->
    <div id="config-banner" class="mb-4 p-3 bg-purple-900/40 border border-purple-500/30 rounded-xl text-xs text-purple-200 flex items-center justify-between">
      <span><i class="fa-brands fa-discord mr-2"></i> Estado de Discord: <strong id="discord-status-text">Conectando...</strong></span>
      <button onclick="promptDiscordID()" class="px-2 py-1 bg-purple-600 hover:bg-purple-500 rounded text-white text-[10px] transition">Cambiar ID</button>
    </div>

    <!-- Live indicator badge -->
    <div class="flex justify-center mb-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/60 border border-white/10 backdrop-blur-md text-xs text-gray-300">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span><strong id="live-views">4</strong> viendo ahora</span>
      </div>
    </div>

    <!-- Glass Profile Card -->
    <div class="glass-card rounded-3xl p-6 flex flex-col items-center text-center relative overflow-hidden">
      
      <!-- Avatar con Neón -->
      <div class="relative mb-4 mt-2">
        <div id="avatar-ring" class="w-24 h-24 rounded-full p-[3px] bg-gradient-to-tr from-purple-500 via-indigo-500 to-pink-500 avatar-glow transition-all duration-500">
          <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-full h-full object-cover rounded-full bg-neutral-900" alt="Avatar" />
        </div>
        <span id="discord-status-dot" class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-gray-500 border-2 border-black" title="Estado"></span>
      </div>

      <!-- User Title & Status -->
      <h2 id="discord-username" class="text-xl font-bold tracking-wide text-white uppercase">TORRES LIVE</h2>
      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 mt-1 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-[11px] text-emerald-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span id="status-text">EN LÍNEA</span>
      </div>

      <!-- Main Action Button -->
      <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-full mt-5 py-2.5 px-4 rounded-xl bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-red-900/40 transition-all hover:scale-[1.02] active:scale-[0.98]">
        <i class="fa-solid fa-cart-shopping"></i> TORRES XITER
      </a>

      <!-- Description / Bio -->
      <p class="text-xs text-gray-300 my-4 leading-relaxed px-2 font-light">
        <span id="typed-bio"></span><span class="typing-cursor"></span>
      </p>

      <!-- Discord Presence / Activity Card -->
      <div id="activity-box" class="w-full bg-black/40 border border-white/5 rounded-2xl p-3 text-left mb-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-950/50 border border-purple-500/20 flex items-center justify-center text-purple-400 shrink-0">
          <i id="activity-icon" class="fa-solid fa-code text-lg"></i>
        </div>
        <div class="overflow-hidden">
          <div id="activity-title" class="text-[11px] font-bold text-purple-300 truncate">Visual Studio Code</div>
          <div id="activity-details" class="text-[10px] text-gray-400 truncate">Index.php:181039</div>
          <div id="activity-state" class="text-[9px] text-gray-500 truncate">BrMods $30 Custom - iOS Panel Generator</div>
        </div>
      </div>

      <!-- Social Media Icons -->
      <div class="flex items-center justify-center gap-3 w-full mb-4">
        <a href="https://youtube.com" target="_blank" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-gray-300 hover:text-white transition"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://discord.gg/YGtZFwfY3U" target="_blank" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-gray-300 hover:text-white transition"><i class="fa-brands fa-discord"></i></a>
        <a href="https://wa.me/" target="_blank" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-gray-300 hover:text-white transition"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://tiktok.com" target="_blank" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 flex items-center justify-center text-gray-300 hover:text-white transition"><i class="fa-brands fa-tiktok"></i></a>
      </div>

      <!-- Link Card -->
      <div onclick="copyDiscordLink()" class="w-full bg-black/30 border border-white/5 hover:border-white/20 rounded-xl p-3 flex items-center justify-between cursor-pointer transition group mb-4">
        <div class="flex items-center gap-3">
          <i class="fa-brands fa-discord text-xl text-indigo-400"></i>
          <div class="text-left">
            <div class="text-xs font-semibold text-white">Tienda De Hacks</div>
            <div class="text-[10px] text-gray-400 group-hover:text-gray-200">https://discord.gg/YGtZFwfY3U</div>
          </div>
        </div>
        <i class="fa-regular fa-copy text-xs text-gray-500 group-hover:text-white"></i>
      </div>

      <!-- Footer Info -->
      <div class="flex items-center justify-between w-full text-[11px] text-gray-400 border-t border-white/5 pt-3">
        <span class="flex items-center gap-1"><i class="fa-regular fa-eye"></i> <span id="view-count">53</span> vistas</span>
        <button onclick="shareProfile()" class="hover:text-white transition flex items-center gap-1"><i class="fa-solid fa-share-nodes"></i> compartir</button>
        <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> <span id="live-clock">18:10:39</span></span>
      </div>

    </div>

    <!-- Audio Player Visualizer Bar -->
    <div class="mt-4 flex items-center justify-center gap-4 bg-black/60 backdrop-blur-md border border-white/10 rounded-full py-2 px-6">
      <div id="equalizer" class="flex items-end gap-1 h-6">
        <span class="w-1 bg-red-500 rounded-full bar-anim" style="animation-delay: 0.1s"></span>
        <span class="w-1 bg-red-500 rounded-full bar-anim" style="animation-delay: 0.3s"></span>
        <span class="w-1 bg-red-500 rounded-full bar-anim" style="animation-delay: 0.2s"></span>
        <span class="w-1 bg-red-500 rounded-full bar-anim" style="animation-delay: 0.4s"></span>
      </div>
      <button id="audio-toggle" onclick="toggleAudio()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white text-xs transition">
        <i class="fa-solid fa-pause"></i>
      </button>
    </div>

  </div>

  <!-- Lanyard / Discord API Integration -->
  <script>
    // Tu ID de Discord (Configurado por defecto o personalizable)
    let DISCORD_ID = localStorage.getItem('discord_user_id') || 'YOUR_DISCORD_USER_ID';

    function promptDiscordID() {
      const id = prompt("Ingresa tu Discord User ID (ID de usuario de 18-19 dígitos):", DISCORD_ID);
      if(id) {
        localStorage.setItem('discord_user_id', id.trim());
        DISCORD_ID = id.trim();
        connectLanyard();
      }
    }

    // WebSocket Lanyard API
    let lanyardWS;
    function connectLanyard() {
      if (lanyardWS) lanyardWS.close();
      
      const statusText = document.getElementById('discord-status-text');
      statusText.innerText = "Conectando...";

      lanyardWS = new WebSocket('wss://api.lanyard.rest/socket');

      lanyardWS.onopen = () => {
        lanyardWS.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: DISCORD_ID }
        }));
      };

      lanyardWS.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.t === 'INIT_STATE' || data.t === 'PRESENCE_UPDATE') {
          updateDiscordPresence(data.d);
          statusText.innerText = "Conectado (" + DISCORD_ID + ")";
        }
      };

      lanyardWS.onerror = () => {
        statusText.innerText = "ID No Encontrado / Error";
      };
    }

    function updateDiscordPresence(data) {
      if (!data) return;

      // Avatar
      const avatarImg = document.getElementById('discord-avatar');
      if (data.discord_user.avatar) {
        avatarImg.src = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png?size=256`;
      }

      // Username
      document.getElementById('discord-username').innerText = data.discord_user.global_name || data.discord_user.username;

      // Status Indicator Dot & Text
      const statusDot = document.getElementById('discord-status-dot');
      const statusText = document.getElementById('status-text');
      const statusColors = {
        online: 'bg-emerald-500',
        idle: 'bg-amber-500',
        dnd: 'bg-red-500',
        offline: 'bg-gray-500'
      };
      statusDot.className = `absolute bottom-1 right-1 w-5 h-5 rounded-full border-2 border-black ${statusColors[data.discord_status] || 'bg-gray-500'}`;
      statusText.innerText = data.discord_status === 'offline' ? 'DESCONECTADO' : data.discord_status.toUpperCase();

      // Activity / Rich Presence (VS Code, Games, Custom Status)
      if (data.activities && data.activities.length > 0) {
        const act = data.activities.find(a => a.type === 0) || data.activities[0];
        document.getElementById('activity-title').innerText = act.name || 'En actividad';
        document.getElementById('activity-details').innerText = act.details || act.state || 'Activo en Discord';
        document.getElementById('activity-state').innerText = act.state || 'En ejecución';
      }
    }

    // Typing Animation
    const fullBioText = "Somos una empresa comprometida en ofrecer el mejor producto al mejor precio, con calidad y atención ga";
    let bioIdx = 0;
    function typeBio() {
      if (bioIdx < fullBioText.length) {
        document.getElementById("typed-bio").innerHTML += fullBioText.charAt(bioIdx);
        bioIdx++;
        setTimeout(typeBio, 35);
      }
    }

    // Live Clock & View Counter
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
    }

    // Copy & Share Actions
    function copyDiscordLink() {
      navigator.clipboard.writeText("https://discord.gg/YGtZFwfY3U");
      alert("¡Enlace de Discord copiado al portapapeles!");
    }

    function shareProfile() {
      if (navigator.share) {
        navigator.share({ title: 'TORRES LIVE', url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("¡Enlace de la página copiado!");
      }
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      typeBio();
      setInterval(updateClock, 1000);
      updateClock();
      connectLanyard();
    });
  </script>
</body>
</html>
